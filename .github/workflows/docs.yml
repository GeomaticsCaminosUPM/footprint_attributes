name: docs

# Builds the Sphinx documentation and publishes it with GitHub Pages
# (Settings > Pages > Source: GitHub Actions). Served at
# https://geomaticscaminosupm.github.io/footprint_attributes/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # nbsphinx renders the notebooks' markdown cells with pandoc.
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: uv sync --locked --group docs
      - run: uv run --no-sync sphinx-build -b html docs site
      - run: touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
