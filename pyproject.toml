[project]
name = "footprint-attributes"
version = "1.0.0"
description = "Compute seismic related attributes of building footprints about position and regularity based on international codes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "geopandas>=1.0.1",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
    "shapely>=2.0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footprint_attributes"]

[tool.uv.sources]
fancyfolium = { git = "https://github.com/GeomaticsCaminosUPM/FancyFolium.git" }

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.15.20",
]
docs = [
    "myst-parser>=3.0.1",
    "nbsphinx>=0.9.8",
    "sphinx>=7.4.7",
    "sphinx-rtd-theme>=3.1.0",
]
visualization = [
    "folium>=0.20.0",
    "ipykernel>=6.31.0",
    "jupyter>=1.1.1",
    "mapclassify>=2.8.1",
    "matplotlib>=3.9.4",
    "nbconvert>=7.17.1",
    "fancyfolium",
]
